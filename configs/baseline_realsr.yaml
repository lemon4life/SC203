# Phase 1 vanilla DoSSR baseline. Paths target the standard Colab layout.
# WARNING: RealSRVal_crop128 contains both test_HR (512x512) and test_LR (128x128).
# Do not pass the parent RealSRVal_crop128 directory as input_dir (src/run_dossr.py
# and scripts/prepare_baseline_smoke.py now reject directories containing test_HR
# or subfolders). Use configs/baseline_realsr_lr128.yaml (which points to test_LR)
# or pass --source-dir .../RealSRVal_crop128/test_LR when staging.
seed: 42
input_dir: /content/drive/MyDrive/lemmepass/data/StableSR_testsets/StableSR_testsets/RealSRVal_crop128
output_root: /content/outputs/baseline
checkpoint: /content/drive/MyDrive/lemmepass/weights/dossr_default.ckpt
model_config: /content/SC203/external/DOSSR/configs/model/cldm_v21.yaml
inference_script: /content/SC203/external/DOSSR/scripts/inference.py
dossr_root: /content/SC203/external/DOSSR
log_dir: /content/drive/MyDrive/lemmepass/logs

# The checked-in DoSSR inference implementation fixes the sampler to 3rd order
# and sets t1 to floor(T/2) through its trunc_12 schedule. The runner validates
# these paper defaults; they are not upstream CLI flags.
steps: 5
solver_order: 3
t1_fraction: 0.5
device: cuda
precision: fp32
tiled: false
tile_size: 512
tile_stride: 256
sr_scale: 4
color_fix_type: wavelet
preprocessor: RealESRNet
