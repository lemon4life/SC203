# Phase 1 vanilla DoSSR baseline on RealSRVal_crop128/test_LR (128x128 -> 512x512 at x4).
# gt_dir is recorded for downstream metrics (scripts/compute_metrics.py) and is NOT passed to DoSSR.
seed: 42
input_dir: /content/drive/MyDrive/lemmepass/data/StableSR_testsets/StableSR_testsets/RealSRVal_crop128/test_LR
gt_dir: /content/drive/MyDrive/lemmepass/data/StableSR_testsets/StableSR_testsets/RealSRVal_crop128/test_HR
output_root: /content/outputs/baseline-lr128
checkpoint: /content/drive/MyDrive/lemmepass/weights/dossr_default.ckpt
model_config: /content/SC203/external/DOSSR/configs/model/cldm_v21.yaml
inference_script: /content/SC203/external/DOSSR/scripts/inference.py
dossr_root: /content/SC203/external/DOSSR
log_dir: /content/drive/MyDrive/lemmepass/logs

steps: 5
solver_order: 3
t1_fraction: 0.5
device: cuda
precision: fp16
offload_condition_encoder: false
tiled: false
tile_size: 512
tile_stride: 256
sr_scale: 4
color_fix_type: wavelet
preprocessor: RealESRNet
